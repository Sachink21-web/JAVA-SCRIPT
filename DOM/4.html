<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM chai aur code</title>
</head>
    <body style="background-color: black; color: rgb(251, 112, 251);">
     
        <ul class="language">

            <li>javascript</li>
        </ul>
        
</body>
<script>

    function addlanguagae (languagename ) {
        const Tech = document.createElement('li')
        Tech.innerHTML = `${languagename}`
        document.querySelector('.language').appendChild(Tech)
    }
    addlanguagae("python")

    function addoptilang (langname){
        const addlanguage = document.createElement('li')
        addlanguage.appendChild(document.createTextNode(langname))
        document.querySelector('.language').appendChild(addlanguage)
    }
addoptilang('c++')
    //EDIT

    const newchild = document.querySelector('li:nth-child(2)')
    const newli = document.createElement('li')
    newli.textContent = 'JAVA'
    newchild.replaceWith(newli)

    const firstelement = document.querySelector('li:nth-child(1)')
    firstelement.outerHTML = "<li>c sharp </li>"

    const itemToDelete = document.querySelector('li:nth-child(3)')
    itemToDelete.remove()
    
</script>
</html>
